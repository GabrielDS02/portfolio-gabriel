name: Bug
description: Relate um comportamento incorreto e reproduzível.
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o projeto. Não publique dados pessoais ou vulnerabilidades aqui.
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Acesse...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Windows 11, Chrome, desktop
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Procurei issues semelhantes.
          required: true
        - label: Este relato não contém uma vulnerabilidade de segurança.
          required: true
